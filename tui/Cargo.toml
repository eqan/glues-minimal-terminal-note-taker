[package]
name = "glues-tui"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal note-taking app with Markdown preview"
readme = "README.md"
keywords.workspace = true
default-run = "glues-tui"

[lib]
name = "glues_tui"

[dependencies]
glues-core.workspace = true
async-recursion.workspace = true
color-eyre = "0.6.3"
tui-textarea = { package = "ratatui-textarea", version = "0.9.4", default-features = false, features = ["crossterm", "search"] }
textwrap = "0.16"
pulldown-cmark = "0.13.6"
arboard = "3.4.1"
image = { version = "0.25.5", default-features = false, features = ["png"] }
uuid = { version = "1.18.1", features = ["v7"] }
tokio = { version = "1.41.0", features = ["macros", "rt-multi-thread"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[[bin]]
name = "glues-tui"
path = "src/main.rs"

[dev-dependencies]
insta = { version = "1", default-features = false }
